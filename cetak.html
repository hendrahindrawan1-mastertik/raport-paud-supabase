<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Cetak Raport - Raport PAUD</title>
<style>
  /* Kertas F4 (215 x 330 mm). Ubah angka di bawah ini jika sekolah punya ukuran baku lain:
     atas-bawah 10mm, kiri-kanan 10mm. Samakan juga dengan padding .sheet di bawah. */
  @page { size: 215mm 330mm; margin: 10mm 10mm; }
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; color:#111; margin:0; background:#e9ece9; font-size:12pt; line-height:1.15; }
  p { margin:0; }

  .toolbar { position:sticky; top:0; z-index:10; background:#1f4d36; padding:12px 20px; display:flex; gap:10px; align-items:center; font-family:Arial,sans-serif; }
  .toolbar button, .toolbar a { background:#2f6f4f; color:#fff; border:none; padding:9px 16px; border-radius:6px; font-weight:600; cursor:pointer; text-decoration:none; font-size:.9rem; }
  .toolbar span { color:#fff; font-size:.85rem; opacity:.85; }

  /* Tampilan layar meniru kertas F4 dengan margin yang sama dengan hasil cetak */
  .sheet { background:#fff; width:215mm; min-height:330mm; margin:16px auto; padding:10mm 10mm; box-shadow:0 0 8px rgba(0,0,0,.15); }

  /* ===== Kop ===== */
  .kop { display:flex; align-items:center; gap:3mm; }
  .kop img.logo { width:29.5mm; height:29.5mm; object-fit:contain; flex-shrink:0; }
  .kop .teks-kop { text-align:center; flex:1; }
  .kop .teks-kop .yayasan { font-weight:bold; font-size:15pt; }
  .kop .teks-kop .sekolah { font-weight:bold; font-size:15pt; margin-top:1px; }
  .kop .teks-kop .info { font-weight:bold; font-size:9.5pt; margin-top:2px; line-height:1.3; }
  /* Garis kop ganda: tebal di atas, tipis di bawah (mengikuti raport lama) */
  .garis-kop { border:none; border-top:0.7mm solid #111; border-bottom:0.3mm solid #111; height:1.6mm; margin:3mm 0 3mm; }

  .judul { text-align:center; font-weight:bold; font-size:14pt; margin:0 0 3mm; line-height:1.3; }

  /* ===== Identitas ===== */
  table.identitas { width:100%; border-collapse:collapse; margin-bottom:3mm; font-size:12pt; }
  table.identitas td { padding:1mm 1mm; vertical-align:top; }
  table.identitas td.label { font-weight:bold; width:33mm; }
  table.identitas td.titik { font-weight:bold; width:5mm; }

  /* ===== Aspek perkembangan ===== */
  .aspek { margin-bottom:-1.5px; }
  .aspek .blok-capaian { border:1.5px solid #111; margin-bottom:-1.5px; break-inside:avoid; page-break-inside:avoid; }
  .aspek .judul-aspek { font-weight:bold; font-size:14pt; padding:1mm 3mm; border-bottom:1.5px solid #111; }
  .aspek p.intro { padding:1.5mm 3mm 0.5mm; text-align:justify; text-justify:inter-word; }
  table.baris-capaian { width:100%; border-collapse:collapse; table-layout:fixed; }
  table.baris-capaian td { padding:1mm 3mm 2mm; vertical-align:top; }
  table.baris-capaian td.kolom-foto { width:44mm; }
  table.baris-capaian img.foto { width:38mm; max-height:46mm; object-fit:cover; display:block; border:1px solid #999; }
  .aspek .baris-bimbingan { padding:1.5mm 3mm 2mm; border:1.5px solid #111; break-inside:avoid; page-break-inside:avoid; }
  .aspek .intro-bimbingan { margin:0 0 0.5mm; text-align:justify; text-justify:inter-word; }

  /* Daftar poin: penanda panah, teks rata kiri-kanan */
  ul.poin { list-style:none; margin:0; padding:0; }
  ul.poin li { position:relative; padding-left:6mm; margin-bottom:0.5mm; text-align:justify; text-justify:inter-word; }
  ul.poin li::before { content:""; position:absolute; left:.8mm; top:.45em; border-left:2.4mm solid #111; border-top:1.3mm solid transparent; border-bottom:1.3mm solid transparent; }

  .penutup { border:1.5px solid #111; border-top:none; padding:2mm 3mm; margin-bottom:-1.5px; font-style:italic; break-inside:avoid; }

  /* ===== Pertumbuhan & kehadiran ===== */
  table.tumbuh-hadir { width:100%; border-collapse:collapse; margin-top:0; font-size:12pt; break-inside:avoid; page-break-inside:avoid; }
  table.tumbuh-hadir th { border:1.5px solid #111; text-align:left; padding:1.5mm 3mm; font-size:12pt; }
  table.tumbuh-hadir td { border:1.5px solid #111; padding:2mm 3mm; vertical-align:top; }
  table.tumbuh-hadir ul { margin:0; padding-left:5mm; }
  table.tumbuh-hadir li { margin-bottom:1.5mm; }
  table.tumbuh-hadir .lbl { display:inline-block; min-width:38mm; }

  /* ===== Tanda tangan ===== */
  .blok-ttd { break-inside:avoid; page-break-inside:avoid; }
  .ttd-row { display:flex; justify-content:space-between; margin-top:5mm; font-size:12pt; }
  .ttd-row .kiri { width:45%; }
  .ttd-row .kanan { width:45%; text-align:left; }
  .ttd-row .spasi { height:16mm; }

  .ttd-kepsek { margin-top:5mm; text-align:center; font-size:12pt; }
  .ttd-kepsek .spasi { height:16mm; }

  .loading { padding:60px; text-align:center; font-family:Arial; color:#666; }

  @media print {
    .toolbar { display:none; }
    /* Margin sudah diatur oleh @page, jadi padding dan margin lembar dinolkan agar tidak dobel */
    .sheet { box-shadow:none; margin:0; padding:0; width:auto; min-height:auto; }
    body { background:#fff; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="window.print()">🖨️ Cetak / Simpan sebagai PDF</button>
  <a id="linkEdit" href="#">&larr; Edit Laporan</a>
  <span id="infoAtas">Memuat laporan...</span>
</div>

<div id="konten"><div class="loading">Memuat data raport...</div></div>

<script type="module">
  import { wajibLogin, supabase, escapeHtml, tanggalIndo } from './js/supabase-init.js';
  import { ASPEK_LIST, TEKS_INTRO_BIMBINGAN } from './js/aspek.js';

  await wajibLogin();

  const params = new URLSearchParams(location.search);
  const siswaId = params.get('siswa_id');
  const kontenEl = document.getElementById('konten');

  if (!siswaId) { kontenEl.innerHTML = '<div class="loading">Siswa tidak ditemukan.</div>'; throw new Error('no siswa_id'); }

  const { data: siswa } = await supabase.from('siswa').select('*').eq('id', siswaId).single();
  if (!siswa) { kontenEl.innerHTML = '<div class="loading">Data siswa tidak ditemukan.</div>'; throw new Error('siswa not found'); }

  const { data: sekolah } = await supabase.from('sekolah').select('*').eq('id', 1).single();

  let waliKelas = '';
  if (siswa.kelas_id) {
    const { data: kelas } = await supabase.from('kelas').select('*').eq('id', siswa.kelas_id).single();
    waliKelas = kelas?.wali_kelas || '';
  }

  const tahunAjaran = params.get('tahun_ajaran') || sekolah?.tahun_ajaran || '2025/2026';
  const semester = params.get('semester') || sekolah?.semester || 'I (Satu)';

  document.getElementById('linkEdit').href = `laporan_form.html?siswa_id=${siswaId}&tahun_ajaran=${encodeURIComponent(tahunAjaran)}&semester=${encodeURIComponent(semester)}`;
  document.getElementById('infoAtas').textContent = `Laporan Perkembangan Anak — ${siswa.nama} — T.A. ${tahunAjaran} Semester ${semester}`;

  const { data: lap } = await supabase.from('raport_semester').select('*')
    .eq('siswa_id', siswaId).eq('tahun_ajaran', tahunAjaran).eq('semester', semester)
    .maybeSingle();

  if (!lap) {
    kontenEl.innerHTML = `
      <div class="loading">
        <h2>Laporan belum diisi</h2>
        <p>Laporan perkembangan untuk <strong>${escapeHtml(siswa.nama)}</strong> pada Tahun Ajaran ${escapeHtml(tahunAjaran)} Semester ${escapeHtml(semester)} belum diisi.</p>
        <p><a href="laporan_form.html?siswa_id=${siswaId}&tahun_ajaran=${encodeURIComponent(tahunAjaran)}&semester=${encodeURIComponent(semester)}">Isi laporan sekarang &rarr;</a></p>
      </div>`;
    throw new Error('laporan belum ada');
  }

  // Membersihkan simbol "nyasar" dari hasil salin-tempel Word (kotak kosong / penanda bullet lama),
  // karena penanda panah sudah dibuat otomatis oleh tampilan cetak.
  function bersihkan(baris) {
    return baris
      .replace(/[\uE000-\uF8FF\u200B-\u200D\uFEFF]/g, '')
      .replace(/^[\s\u2022\u25CF\u25AA\u25A0\u2023\u27A2\u27A4\u2794\u279C\u25BA\u25B6\u2192\u00B7\-\u2013\u2014*]+/, '')
      .trim();
  }

  function poinList(teks) {
    return (teks || '').split(/\r\n|\r|\n/).map(bersihkan).filter(s => s !== '')
      .map(s => `<li>${escapeHtml(s)}</li>`).join('');
  }

  const htmlAspek = Object.entries(ASPEK_LIST).map(([kode, info]) => {
    const fotoUrl = lap[`${kode}_foto_url`];
    const poinCapaian = poinList(lap[`${kode}_capaian`]);
    const poinBimbingan = poinList(lap[`${kode}_bimbingan`]);
    return `
      <div class="aspek">
        <div class="blok-capaian">
        <div class="judul-aspek">PERKEMBANGAN ${info.label.toUpperCase()}</div>
        <p class="intro">${escapeHtml(info.intro)}</p>
        <table class="baris-capaian">
          <tr>
            ${fotoUrl ? `<td class="kolom-foto"><img class="foto" src="${escapeHtml(fotoUrl)}"></td>` : ''}
            <td><ul class="poin">${poinCapaian}</ul></td>
          </tr>
        </table>
        </div>
        ${poinBimbingan !== '' ? `
          <div class="baris-bimbingan">
            <p class="intro-bimbingan">${TEKS_INTRO_BIMBINGAN}</p>
            <ul class="poin">${poinBimbingan}</ul>
          </div>` : ''}
      </div>
    `;
  }).join('');

  kontenEl.innerHTML = `
    <div class="sheet">
      <div class="kop">
        ${sekolah?.logo_url ? `<img class="logo" src="${sekolah.logo_url}">` : ''}
        <div class="teks-kop">
          <div class="yayasan">${escapeHtml(sekolah?.nama_yayasan) || ''}</div>
          <div class="sekolah">${escapeHtml(sekolah?.nama_sekolah) || ''}</div>
          <div class="info">${escapeHtml(sekolah?.izin) || ''} &nbsp; NPSN : ${escapeHtml(sekolah?.npsn) || ''}</div>
          <div class="info">Alamat : ${escapeHtml(sekolah?.alamat) || ''}</div>
        </div>
        ${sekolah?.logo_yayasan_url ? `<img class="logo" src="${sekolah.logo_yayasan_url}">` : ''}
      </div>
      <hr class="garis-kop">

      <div class="judul">LAPORAN PERKEMBANGAN ANAK<br>TAHUN AJARAN ${escapeHtml(tahunAjaran)}</div>

      <table class="identitas">
        <tr><td class="label">NAMA ANAK</td><td class="titik">:</td><td><strong>${escapeHtml(siswa.nama)}</strong></td></tr>
        <tr>
          <td class="label">NIS/NISN</td><td class="titik">:</td>
          <td><strong>${escapeHtml(siswa.nis) || '-'}/${escapeHtml(siswa.nisn) || '-'}</strong></td>
          <td class="label" style="width:30mm;">SEMESTER</td><td class="titik">:</td><td><strong>${escapeHtml(semester)}</strong></td>
        </tr>
      </table>

      ${htmlAspek}

      ${(lap.catatan_penutup || '').trim() !== '' ? `<div class="penutup">${escapeHtml(lap.catatan_penutup)}</div>` : ''}

      <table class="tumbuh-hadir">
        <tr><th style="width:50%;">PERTUMBUHAN</th><th>KEHADIRAN</th></tr>
        <tr>
          <td><ul>
            <li><span class="lbl">Berat Badan</span>: ${escapeHtml(lap.berat_badan) || '-'}</li>
            <li><span class="lbl">Tinggi Badan</span>: ${escapeHtml(lap.tinggi_badan) || '-'}</li>
            <li><span class="lbl">Lingkar Kepala</span>: ${escapeHtml(lap.lingkar_kepala) || '-'}</li>
          </ul></td>
          <td><ul>
            <li><span class="lbl">Sakit</span>: ${escapeHtml(lap.sakit) || '-'}</li>
            <li><span class="lbl">Izin</span>: ${escapeHtml(lap.izin) || '-'}</li>
            <li><span class="lbl">Tanpa Keterangan</span>: ${escapeHtml(lap.tanpa_keterangan) || '-'}</li>
          </ul></td>
        </tr>
      </table>

      <div class="blok-ttd">
        <div class="ttd-row">
          <div class="kiri">
            Orang Tua / Wali
            <div class="spasi"></div>
            <strong>(________________________)</strong>
          </div>
          <div class="kanan">
            <strong>${escapeHtml(sekolah?.kota) || 'Depok'}, ${tanggalIndo(lap.tanggal_raport)}</strong><br>
            Wali Kelas
            <div class="spasi"></div>
            <strong>${escapeHtml(waliKelas) || '________________________'}</strong>
          </div>
        </div>

        <div class="ttd-kepsek">
          Mengetahui,<br>Kepala Sekolah ${escapeHtml(sekolah?.nama_sekolah) || ''}
          <div class="spasi"></div>
          <strong>${escapeHtml(sekolah?.kepala_sekolah) || '________________________'}</strong>
        </div>
      </div>
    </div>
  `;
</script>
</body>
</html>
