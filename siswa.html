<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Siswa - Raport PAUD</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="navbar"></div>
<div class="container">
  <div class="top-actions">
    <h1>Data Siswa</h1>
    <button class="btn" id="btnTambah">+ Tambah Siswa</button>
  </div>
  <div id="pesan"></div>

  <div class="card" id="cardForm" style="display:none;">
    <h2 id="judulForm">Tambah Siswa</h2>
    <form id="formSiswa" enctype="multipart/form-data">
      <input type="hidden" id="siswaId">
      <h3 style="margin-top:0;">Identitas Siswa</h3>
      <div class="grid-2">
        <div><label>Nama Lengkap</label><input type="text" id="nama" required></div>
        <div><label>Jenis Kelamin</label>
          <select id="jenis_kelamin"><option>Laki-laki</option><option>Perempuan</option></select>
        </div>
      </div>
      <div class="grid-2">
        <div><label>NIS</label><input type="text" id="nis"></div>
        <div><label>NISN</label><input type="text" id="nisn"></div>
      </div>
      <div class="grid-2">
        <div><label>Tempat Lahir</label><input type="text" id="tempat_lahir"></div>
        <div><label>Tanggal Lahir</label><input type="date" id="tanggal_lahir"></div>
      </div>
      <div class="grid-3">
        <div><label>Agama</label><input type="text" id="agama"></div>
        <div><label>Anak ke-</label><input type="number" id="anak_ke" min="1"></div>
        <div><label>Jumlah Saudara</label><input type="number" id="jumlah_saudara" min="0"></div>
      </div>

      <h3>Data Orang Tua</h3>
      <div class="grid-2">
        <div><label>Nama Ayah</label><input type="text" id="nama_ayah"></div>
        <div><label>Pekerjaan Ayah</label><input type="text" id="pekerjaan_ayah"></div>
      </div>
      <div class="grid-2">
        <div><label>Nama Ibu</label><input type="text" id="nama_ibu"></div>
        <div><label>Pekerjaan Ibu</label><input type="text" id="pekerjaan_ibu"></div>
      </div>
      <label>Alamat</label>
      <textarea id="alamat"></textarea>

      <h3>Sekolah</h3>
      <div class="grid-2">
        <div><label>Kelas</label><select id="kelas_id"><option value="">- Pilih Kelas -</option></select></div>
        <div><label>Tahun Ajaran</label><input type="text" id="tahun_ajaran" placeholder="2025/2026"></div>
      </div>

      <label>Foto Siswa</label>
      <input type="file" id="foto" accept="image/*">
      <div id="previewFoto" style="margin-top:8px;"></div>

      <div style="margin-top:20px;" class="actions">
        <button class="btn" type="submit" id="btnSimpanSiswa">Simpan</button>
        <button class="btn secondary" type="button" id="btnBatal">Batal</button>
      </div>
    </form>
  </div>

  <div class="card">
    <table>
      <tr><th>Foto</th><th>Nama</th><th>Kelas</th><th>TTL</th><th>Orang Tua</th><th>Aksi</th></tr>
      <tbody id="tbodySiswa"><tr><td colspan="6" class="empty">Memuat...</td></tr></tbody>
    </table>
  </div>
</div>
<footer>Aplikasi Raport PAUD &middot; TAAM Nurul Iman &middot; ditenagai Supabase</footer>

<script type="module">
  import { wajibLogin, supabase, unggahGambar, tanggalIndo, escapeHtml } from './js/supabase-init.js';
  import { renderNavbar } from './js/navbar.js';

  await wajibLogin();
  renderNavbar('siswa');

  let daftarKelas = [];
  let daftarSiswa = [];

  async function muatDropdownKelas() {
    const { data } = await supabase.from('kelas').select('*').order('nama_kelas');
    daftarKelas = data || [];
    const sel = document.getElementById('kelas_id');
    sel.innerHTML = '<option value="">- Pilih Kelas -</option>' +
      daftarKelas.map(k => `<option value="${k.id}">${escapeHtml(k.nama_kelas)}</option>`).join('');
  }

  function namaKelas(id) {
    const k = daftarKelas.find(x => x.id === id);
    return k ? k.nama_kelas : '-';
  }

  async function muatSiswa() {
    const { data, error } = await supabase.from('siswa').select('*').order('nama');
    const tbody = document.getElementById('tbodySiswa');
    if (error) { tbody.innerHTML = `<tr><td colspan="6" class="empty">Gagal memuat: ${escapeHtml(error.message)}</td></tr>`; return; }
    daftarSiswa = data || [];
    if (daftarSiswa.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">Belum ada data siswa. Klik "+ Tambah Siswa" untuk mulai.</td></tr>';
      return;
    }
    tbody.innerHTML = daftarSiswa.map(s => `
      <tr>
        <td>${s.foto_url ? `<img class="foto-preview" src="${s.foto_url}">` : '<span class="helper-text">Belum ada foto</span>'}</td>
        <td><strong>${escapeHtml(s.nama)}</strong><br><span class="helper-text">NIS: ${escapeHtml(s.nis) || '-'}</span></td>
        <td>${escapeHtml(namaKelas(s.kelas_id))}</td>
        <td>${escapeHtml(s.tempat_lahir)}, ${tanggalIndo(s.tanggal_lahir)}</td>
        <td>Ayah: ${escapeHtml(s.nama_ayah) || '-'}<br>Ibu: ${escapeHtml(s.nama_ibu) || '-'}</td>
        <td class="actions">
          <button class="btn small" onclick="editSiswa('${s.id}')">Edit</button>
          <a class="btn small" style="background:#1f4d36;" href="laporan_form.html?siswa_id=${s.id}">📝 Laporan</a>
          <a class="btn small secondary" href="cetak.html?siswa_id=${s.id}" target="_blank">🖨️ Cetak</a>
          <button class="btn small danger" onclick="hapusSiswa('${s.id}')">Hapus</button>
        </td>
      </tr>
    `).join('');
  }

  function tampilkanForm(judul) {
    document.getElementById('judulForm').textContent = judul;
    document.getElementById('cardForm').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function sembunyikanForm() {
    document.getElementById('formSiswa').reset();
    document.getElementById('siswaId').value = '';
    document.getElementById('previewFoto').innerHTML = '';
    document.getElementById('cardForm').style.display = 'none';
  }

  document.getElementById('btnTambah').addEventListener('click', () => tampilkanForm('Tambah Siswa'));
  document.getElementById('btnBatal').addEventListener('click', sembunyikanForm);

  window.editSiswa = (id) => {
    const s = daftarSiswa.find(x => x.id === id);
    if (!s) return;
    document.getElementById('siswaId').value = id;
    document.getElementById('nama').value = s.nama || '';
    document.getElementById('jenis_kelamin').value = s.jenis_kelamin || 'Laki-laki';
    document.getElementById('nis').value = s.nis || '';
    document.getElementById('nisn').value = s.nisn || '';
    document.getElementById('tempat_lahir').value = s.tempat_lahir || '';
    document.getElementById('tanggal_lahir').value = s.tanggal_lahir || '';
    document.getElementById('agama').value = s.agama || '';
    document.getElementById('anak_ke').value = s.anak_ke || '';
    document.getElementById('jumlah_saudara').value = s.jumlah_saudara || '';
    document.getElementById('nama_ayah').value = s.nama_ayah || '';
    document.getElementById('pekerjaan_ayah').value = s.pekerjaan_ayah || '';
    document.getElementById('nama_ibu').value = s.nama_ibu || '';
    document.getElementById('pekerjaan_ibu').value = s.pekerjaan_ibu || '';
    document.getElementById('alamat').value = s.alamat || '';
    document.getElementById('kelas_id').value = s.kelas_id || '';
    document.getElementById('tahun_ajaran').value = s.tahun_ajaran || '';
    document.getElementById('previewFoto').innerHTML = s.foto_url ? `<img class="foto-preview" src="${s.foto_url}">` : '';
    tampilkanForm('Edit Siswa');
  };

  window.hapusSiswa = async (id) => {
    if (!confirm('Hapus data siswa ini? Laporan perkembangannya juga akan terhapus.')) return;
    await supabase.from('siswa').delete().eq('id', id);
    muatSiswa();
  };

  document.getElementById('formSiswa').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('siswaId').value;
    const btn = document.getElementById('btnSimpanSiswa');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    try {
      const payload = {
        nama: document.getElementById('nama').value,
        jenis_kelamin: document.getElementById('jenis_kelamin').value,
        nis: document.getElementById('nis').value,
        nisn: document.getElementById('nisn').value,
        tempat_lahir: document.getElementById('tempat_lahir').value,
        tanggal_lahir: document.getElementById('tanggal_lahir').value || null,
        agama: document.getElementById('agama').value,
        anak_ke: document.getElementById('anak_ke').value || null,
        jumlah_saudara: document.getElementById('jumlah_saudara').value || null,
        nama_ayah: document.getElementById('nama_ayah').value,
        pekerjaan_ayah: document.getElementById('pekerjaan_ayah').value,
        nama_ibu: document.getElementById('nama_ibu').value,
        pekerjaan_ibu: document.getElementById('pekerjaan_ibu').value,
        alamat: document.getElementById('alamat').value,
        kelas_id: document.getElementById('kelas_id').value || null,
        tahun_ajaran: document.getElementById('tahun_ajaran').value,
      };
      const file = document.getElementById('foto').files[0];
      if (file) payload.foto_url = await unggahGambar(file, 'siswa');

      const { error } = id
        ? await supabase.from('siswa').update(payload).eq('id', id)
        : await supabase.from('siswa').insert(payload);
      if (error) throw error;

      sembunyikanForm();
      document.getElementById('pesan').innerHTML = '<div class="alert success">Data siswa berhasil disimpan.</div>';
      muatSiswa();
    } catch (err) {
      document.getElementById('pesan').innerHTML = `<div class="alert error">Gagal menyimpan: ${escapeHtml(err.message)}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = 'Simpan';
    }
  });

  await muatDropdownKelas();
  await muatSiswa();
</script>
</body>
</html>
