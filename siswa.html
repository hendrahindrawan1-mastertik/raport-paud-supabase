<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Siswa - Raport PAUD</title>
<link rel="stylesheet" href="assets/style.css">
<style>
/* ===== Tampilan khusus halaman Data Siswa ===== */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
.toolbar .cari{flex:1 1 260px;position:relative;}
.toolbar .cari input{padding-left:44px;}
.toolbar .cari svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#5b6b62;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
.toolbar select{flex:0 1 230px;width:auto;}
.jumlah{color:var(--muted);font-size:.9rem;margin:12px 0 0;}

.siswa-cell{display:flex;align-items:center;gap:14px;min-width:220px;}
.avatar{flex:none;width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--mint);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;box-shadow:0 0 0 1px var(--border);}
.siswa-nama{font-weight:800;color:var(--text);line-height:1.25;}
.siswa-nis{font-size:.84rem;color:var(--muted);margin-top:2px;}

.kelas-badge{display:inline-block;padding:3px 12px;border-radius:999px;font-size:.84rem;font-weight:700;white-space:nowrap;}
.k0{background:#e3f3e8;color:#174b36;}
.k1{background:#fcefd0;color:#6b4300;}
.k2{background:#e3ecfb;color:#1d3f7a;}
.k3{background:#f9e3ea;color:#7a1f3d;}
.k4{background:#ece6f8;color:#46307a;}
.kelas-none{color:var(--muted);}

.row-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.btn.ghost{background:transparent;color:var(--primary-dark);box-shadow:inset 0 0 0 1.5px #cfdcd3;}
.btn.ghost:hover{background:var(--mint);color:var(--primary-dark);}
.btn.ghost-danger{background:transparent;color:#a53a30;box-shadow:inset 0 0 0 1.5px #f0c8c3;}
.btn.ghost-danger:hover{background:#fbe7e5;color:#8f342b;}

@media(min-width:761px){
  .tabel-siswa thead th{position:sticky;top:64px;z-index:5;}
}
@media(max-width:760px){
  .tabel-siswa thead{display:none;}
  .tabel-siswa,.tabel-siswa tbody,.tabel-siswa tr,.tabel-siswa td{display:block;width:100%;}
  .tabel-siswa tr{border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;background:#fff;}
  .tabel-siswa tr:hover td{background:transparent;}
  .tabel-siswa td{border:0;padding:6px 0;}
  .tabel-siswa td[data-label]::before{content:attr(data-label);display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:1px;}
  .toolbar select{flex:1 1 100%;}
}
</style>
</head>
<body>
<div id="navbar"></div>
<div class="container">
  <div class="top-actions">
    <h1>Data Siswa</h1>
    <button class="btn" id="btnTambah">+ Tambah Siswa</button>
  </div>
  <div id="pesan"></div>

  <div class="card" id="cardForm" style="display:none;">
    <h2 id="judulForm">Tambah Siswa</h2>
    <form id="formSiswa" enctype="multipart/form-data">
      <input type="hidden" id="siswaId">
      <h3 style="margin-top:0;">Identitas Siswa</h3>
      <div class="grid-2">
        <div><label>Nama Lengkap</label><input type="text" id="nama" required></div>
        <div><label>Jenis Kelamin</label>
          <select id="jenis_kelamin"><option>Laki-laki</option><option>Perempuan</option></select>
        </div>
      </div>
      <div class="grid-2">
        <div><label>NIS</label><input type="text" id="nis"></div>
        <div><label>NISN</label><input type="text" id="nisn"></div>
      </div>
      <div class="grid-2">
        <div><label>Tempat Lahir</label><input type="text" id="tempat_lahir"></div>
        <div><label>Tanggal Lahir</label><input type="date" id="tanggal_lahir"></div>
      </div>
      <div class="grid-3">
        <div><label>Agama</label><input type="text" id="agama"></div>
        <div><label>Anak ke-</label><input type="number" id="anak_ke" min="1"></div>
        <div><label>Jumlah Saudara</label><input type="number" id="jumlah_saudara" min="0"></div>
      </div>

      <h3>Data Orang Tua</h3>
      <div class="grid-2">
        <div><label>Nama Ayah</label><input type="text" id="nama_ayah"></div>
        <div><label>Pekerjaan Ayah</label><input type="text" id="pekerjaan_ayah"></div>
      </div>
      <div class="grid-2">
        <div><label>Nama Ibu</label><input type="text" id="nama_ibu"></div>
        <div><label>Pekerjaan Ibu</label><input type="text" id="pekerjaan_ibu"></div>
      </div>
      <label>Alamat</label>
      <textarea id="alamat"></textarea>

      <h3>Sekolah</h3>
      <div class="grid-2">
        <div><label>Kelas</label><select id="kelas_id"><option value="">- Pilih Kelas -</option></select></div>
        <div><label>Tahun Ajaran</label><input type="text" id="tahun_ajaran" placeholder="2025/2026"></div>
      </div>

      <label>Foto Siswa</label>
      <input type="file" id="foto" accept="image/*">
      <div id="previewFoto" style="margin-top:8px;"></div>

      <div style="margin-top:20px;" class="actions">
        <button class="btn" type="submit" id="btnSimpanSiswa">Simpan</button>
        <button class="btn secondary" type="button" id="btnBatal">Batal</button>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="cari">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="cari" placeholder="Cari nama, NIS, atau nama orang tua" aria-label="Cari siswa" autocomplete="off">
      </div>
      <select id="filterKelas" aria-label="Filter kelas">
        <option value="">Semua kelas</option>
      </select>
    </div>
    <p class="jumlah" id="jumlah" aria-live="polite"></p>

    <table class="tabel-siswa">
      <thead>
        <tr><th>Siswa</th><th>Kelas</th><th>TTL</th><th>Orang Tua</th><th>Aksi</th></tr>
      </thead>
      <tbody id="tbodySiswa"><tr><td colspan="5" class="empty">Memuat...</td></tr></tbody>
    </table>
  </div>
</div>
<footer>Aplikasi Raport PAUD &middot; TAAM Nurul Iman &middot; ditenagai Supabase</footer>

<script type="module">
  import { wajibLogin, supabase, unggahGambar, tanggalIndo, escapeHtml } from './js/supabase-init.js';
  import { renderNavbar } from './js/navbar.js';

  await wajibLogin();
  renderNavbar('siswa');

  let daftarKelas = [];
  let daftarSiswa = [];

  async function muatDropdownKelas() {
    const { data } = await supabase.from('kelas').select('*').order('nama_kelas');
    daftarKelas = data || [];
    const opsi = daftarKelas.map(k => `<option value="${k.id}">${escapeHtml(k.nama_kelas)}</option>`).join('');
    document.getElementById('kelas_id').innerHTML = '<option value="">- Pilih Kelas -</option>' + opsi;
    document.getElementById('filterKelas').innerHTML =
      '<option value="">Semua kelas</option>' + opsi + '<option value="none">Tanpa kelas</option>';
  }

  function inisial(nama) {
    const kata = (nama || '?').trim().split(/\s+/);
    return ((kata[0] || '?')[0] + (kata[1] ? kata[1][0] : '')).toUpperCase();
  }

  function labelKelas(id) {
    const i = daftarKelas.findIndex(x => x.id === id);
    if (i < 0) return '<span class="kelas-none">-</span>';
    return `<span class="kelas-badge k${i % 5}">${escapeHtml(daftarKelas[i].nama_kelas)}</span>`;
  }

  async function muatSiswa() {
    const { data, error } = await supabase.from('siswa').select('*').order('nama');
    const tbody = document.getElementById('tbodySiswa');
    if (error) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty">Gagal memuat: ${escapeHtml(error.message)}</td></tr>`;
      return;
    }
    daftarSiswa = data || [];
    tampilkanDaftar();
  }

  function tampilkanDaftar() {
    const tbody = document.getElementById('tbodySiswa');
    const jumlah = document.getElementById('jumlah');
    const q = document.getElementById('cari').value.trim().toLowerCase();
    const k = document.getElementById('filterKelas').value;

    if (daftarSiswa.length === 0) {
      jumlah.textContent = '';
      tbody.innerHTML = '<tr><td colspan="5" class="empty">Belum ada data siswa. Klik "+ Tambah Siswa" untuk mulai.</td></tr>';
      return;
    }

    const hasil = daftarSiswa.filter(s => {
      const cocokKelas = !k || (k === 'none' ? !s.kelas_id : String(s.kelas_id) === k);
      const teks = [s.nama, s.nis, s.nama_ayah, s.nama_ibu].join(' ').toLowerCase();
      return cocokKelas && (!q || teks.includes(q));
    });

    jumlah.textContent = `Menampilkan ${hasil.length} dari ${daftarSiswa.length} siswa`;

    if (hasil.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">Tidak ada siswa yang cocok dengan pencarian.</td></tr>';
      return;
    }

    tbody.innerHTML = hasil.map(s => {
      const foto = s.foto_url
        ? `<img class="avatar" src="${escapeHtml(s.foto_url)}" alt="Foto ${escapeHtml(s.nama)}" loading="lazy">`
        : `<span class="avatar" aria-hidden="true">${escapeHtml(inisial(s.nama))}</span>`;
      const ttl = [escapeHtml(s.tempat_lahir), s.tanggal_lahir ? tanggalIndo(s.tanggal_lahir) : '']
        .filter(Boolean).join(', ') || '-';
      return `
      <tr>
        <td>
          <div class="siswa-cell">
            ${foto}
            <div>
              <div class="siswa-nama">${escapeHtml(s.nama)}</div>
              <div class="siswa-nis">NIS: ${escapeHtml(s.nis) || '-'}</div>
            </div>
          </div>
        </td>
        <td data-label="Kelas">${labelKelas(s.kelas_id)}</td>
        <td data-label="TTL">${ttl}</td>
        <td data-label="Orang Tua">Ayah: ${escapeHtml(s.nama_ayah) || '-'}<br>Ibu: ${escapeHtml(s.nama_ibu) || '-'}</td>
        <td>
          <div class="row-actions">
            <a class="btn small" href="laporan_form.html?siswa_id=${s.id}">Laporan</a>
            <a class="btn small ghost" href="cetak.html?siswa_id=${s.id}" target="_blank">Cetak</a>
            <button class="btn small ghost" onclick="editSiswa('${s.id}')">Edit</button>
            <button class="btn small ghost-danger" onclick="hapusSiswa('${s.id}')">Hapus</button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  document.getElementById('cari').addEventListener('input', tampilkanDaftar);
  document.getElementById('filterKelas').addEventListener('change', tampilkanDaftar);

  function tampilkanForm(judul) {
    document.getElementById('judulForm').textContent = judul;
    document.getElementById('cardForm').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function sembunyikanForm() {
    document.getElementById('formSiswa').reset();
    document.getElementById('siswaId').value = '';
    document.getElementById('previewFoto').innerHTML = '';
    document.getElementById('cardForm').style.display = 'none';
  }

  document.getElementById('btnTambah').addEventListener('click', () => tampilkanForm('Tambah Siswa'));
  document.getElementById('btnBatal').addEventListener('click', sembunyikanForm);

  window.editSiswa = (id) => {
    const s = daftarSiswa.find(x => x.id === id);
    if (!s) return;
    document.getElementById('siswaId').value = id;
    document.getElementById('nama').value = s.nama || '';
    document.getElementById('jenis_kelamin').value = s.jenis_kelamin || 'Laki-laki';
    document.getElementById('nis').value = s.nis || '';
    document.getElementById('nisn').value = s.nisn || '';
    document.getElementById('tempat_lahir').value = s.tempat_lahir || '';
    document.getElementById('tanggal_lahir').value = s.tanggal_lahir || '';
    document.getElementById('agama').value = s.agama || '';
    document.getElementById('anak_ke').value = s.anak_ke || '';
    document.getElementById('jumlah_saudara').value = s.jumlah_saudara || '';
    document.getElementById('nama_ayah').value = s.nama_ayah || '';
    document.getElementById('pekerjaan_ayah').value = s.pekerjaan_ayah || '';
    document.getElementById('nama_ibu').value = s.nama_ibu || '';
    document.getElementById('pekerjaan_ibu').value = s.pekerjaan_ibu || '';
    document.getElementById('alamat').value = s.alamat || '';
    document.getElementById('kelas_id').value = s.kelas_id || '';
    document.getElementById('tahun_ajaran').value = s.tahun_ajaran || '';
    document.getElementById('previewFoto').innerHTML = s.foto_url ? `<img class="foto-preview" src="${s.foto_url}">` : '';
    tampilkanForm('Edit Siswa');
  };

  window.hapusSiswa = async (id) => {
    const s = daftarSiswa.find(x => x.id === id);
    const nama = s ? s.nama : 'siswa ini';
    if (!confirm(`Hapus data ${nama}? Laporan perkembangannya juga akan terhapus.`)) return;
    const { error } = await supabase.from('siswa').delete().eq('id', id);
    if (error) {
      document.getElementById('pesan').innerHTML = `<div class="alert error">Gagal menghapus: ${escapeHtml(error.message)}</div>`;
      return;
    }
    muatSiswa();
  };

  document.getElementById('formSiswa').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('siswaId').value;
    const btn = document.getElementById('btnSimpanSiswa');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    try {
      const payload = {
        nama: document.getElementById('nama').value,
        jenis_kelamin: document.getElementById('jenis_kelamin').value,
        nis: document.getElementById('nis').value,
        nisn: document.getElementById('nisn').value,
        tempat_lahir: document.getElementById('tempat_lahir').value,
        tanggal_lahir: document.getElementById('tanggal_lahir').value || null,
        agama: document.getElementById('agama').value,
        anak_ke: document.getElementById('anak_ke').value || null,
        jumlah_saudara: document.getElementById('jumlah_saudara').value || null,
        nama_ayah: document.getElementById('nama_ayah').value,
        pekerjaan_ayah: document.getElementById('pekerjaan_ayah').value,
        nama_ibu: document.getElementById('nama_ibu').value,
        pekerjaan_ibu: document.getElementById('pekerjaan_ibu').value,
        alamat: document.getElementById('alamat').value,
        kelas_id: document.getElementById('kelas_id').value || null,
        tahun_ajaran: document.getElementById('tahun_ajaran').value,
      };
      const file = document.getElementById('foto').files[0];
      if (file) payload.foto_url = await unggahGambar(file, 'siswa');

      const { error } = id
        ? await supabase.from('siswa').update(payload).eq('id', id)
        : await supabase.from('siswa').insert(payload);
      if (error) throw error;

      sembunyikanForm();
      document.getElementById('pesan').innerHTML = '<div class="alert success">Data siswa berhasil disimpan.</div>';
      muatSiswa();
    } catch (err) {
      document.getElementById('pesan').innerHTML = `<div class="alert error">Gagal menyimpan: ${escapeHtml(err.message)}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = 'Simpan';
    }
  });

  await muatDropdownKelas();
  await muatSiswa();
</script>
</body>
</html>
