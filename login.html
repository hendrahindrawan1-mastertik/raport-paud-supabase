<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Raport PAUD</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="center-page">
  <div class="card" style="width:360px;">
    <h1 style="text-align:center;">🧒 Raport PAUD</h1>
    <p style="text-align:center;color:#6b7a73;margin-top:-8px;">TAAM Nurul Iman</p>
    <div id="pesanError"></div>
    <form id="formLogin">
      <label>Email</label>
      <input type="email" id="username" required autofocus>
      <div class="helper-text">Gunakan akun bersama yang sudah dibuat di Supabase Authentication (lihat README).</div>
      <label>Password</label>
      <input type="password" id="password" required>
      <div style="margin-top:20px;">
        <button class="btn" type="submit" style="width:100%;" id="btnMasuk">Masuk</button>
      </div>
    </form>
  </div>

  <script type="module">
    import { supabase } from './js/supabase-init.js';

    const params = new URLSearchParams(location.search);
    const kembali = params.get('kembali') || 'index.html';

    // Jika sudah login, langsung lempar ke halaman tujuan
    const { data: { session } } = await supabase.auth.getSession();
    if (session) location.href = kembali;

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const pesanEl = document.getElementById('pesanError');
      const btn = document.getElementById('btnMasuk');
      pesanEl.innerHTML = '';
      btn.disabled = true; btn.textContent = 'Memproses...';
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        pesanEl.innerHTML = '<div class="alert error">Email atau password salah. Pastikan akun sudah dibuat di Supabase Authentication.</div>';
        btn.disabled = false; btn.textContent = 'Masuk';
      } else {
        location.href = kembali;
      }
    });
  </script>
</body>
</html>
